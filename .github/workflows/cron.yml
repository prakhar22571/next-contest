name: Daily contest sync

on:
  schedule:
    # 03:00 UTC daily (matches the old vercel.json cron).
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/sync-all
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync-all")
          echo "HTTP $status"
          cat response.json && echo
          test "$status" = "200"
